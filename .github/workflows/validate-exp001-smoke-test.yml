name: Validation EXP-001 Smoke Test

on:
  push:
    paths:
      - "experiments/EXP-001/EXP-001_smoke_test_20_cases_FR.csv"
      - "scripts/validate_exp001_smoke_test.py"
      - ".github/workflows/validate-exp001-smoke-test.yml"

  pull_request:
    paths:
      - "experiments/EXP-001/EXP-001_smoke_test_20_cases_FR.csv"
      - "scripts/validate_exp001_smoke_test.py"
      - ".github/workflows/validate-exp001-smoke-test.yml"

  workflow_dispatch:

jobs:
  validate-exp001-smoke-test:
    name: Vérifier le corpus EXP-001
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la structure du corpus
        run: |
          python scripts/validate_exp001_smoke_test.py \
            --stage structural

      - name: Vérifier la documentation des références
        run: |
          python scripts/validate_exp001_smoke_test.py \
            --stage documented

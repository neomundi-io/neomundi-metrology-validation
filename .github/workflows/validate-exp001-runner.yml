name: Validate EXP-001 Runner

on:
  push:
    paths:
      - "scripts/run_exp001_smoke_test.py"
      - ".github/workflows/validate-exp001-runner.yml"
  pull_request:
    paths:
      - "scripts/run_exp001_smoke_test.py"
      - ".github/workflows/validate-exp001-runner.yml"
  workflow_dispatch:

jobs:
  validate-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Syntax check EXP-001 runner
        run: |
          python -m py_compile scripts/run_exp001_smoke_test.py

      - name: Confirm runner imports without execution
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/run_exp001_smoke_test.py")

          spec = importlib.util.spec_from_file_location(
              "run_exp001_smoke_test",
              path
          )

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          print("EXP-001 runner import: OK")
          print("Experiment:", module.EXPERIMENT_ID)
          print("Version:", module.EXPERIMENT_VERSION)
          print("Metric:", module.METRIC_ID)
          print("Threshold:", module.THRESHOLD_VALUE)
          PY
